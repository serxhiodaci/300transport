<svg width="640" height="420" viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cabGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9c1de"/>
      <stop offset="1" stop-color="#7aa0c9"/>
    </linearGradient>
    <linearGradient id="trailerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7eef7"/>
      <stop offset="1" stop-color="#ccd7e3"/>
    </linearGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="330" cy="360" rx="270" ry="18" fill="#060f1e" opacity="0.35"/>

  <!-- road -->
  <rect x="0" y="345" width="640" height="6" fill="#163a63"/>
  <g stroke="#e0a02c" stroke-width="4" stroke-dasharray="26 20" opacity="0.8">
    <line x1="0" y1="348" x2="640" y2="348"/>
  </g>

  <!-- motion lines -->
  <g stroke="#4f80b8" stroke-width="4" stroke-linecap="round" opacity="0.55">
    <line x1="20" y1="150" x2="70" y2="150"/>
    <line x1="10" y1="190" x2="80" y2="190"/>
    <line x1="30" y1="230" x2="90" y2="230"/>
  </g>

  <!-- trailer -->
  <g>
    <rect x="230" y="140" width="300" height="170" rx="6" fill="url(#trailerGrad)" stroke="#0a1c34" stroke-width="3"/>
    <rect x="230" y="140" width="300" height="18" fill="#3a6ea5"/>
    <line x1="330" y1="158" x2="330" y2="310" stroke="#a9c1de" stroke-width="2"/>
    <line x1="430" y1="158" x2="430" y2="310" stroke="#a9c1de" stroke-width="2"/>
    <text x="380" y="235" font-family="Oswald, sans-serif" font-size="30" fill="#0a1c34" text-anchor="middle" letter-spacing="2">300</text>
  </g>

  <!-- cab -->
  <g>
    <path d="M90 220 L90 310 L230 310 L230 165 L175 165 L150 190 L110 190 Z" fill="url(#cabGrad)" stroke="#0a1c34" stroke-width="3"/>
    <path d="M155 175 L172 175 L190 195 L155 195 Z" fill="#0a1c34" opacity="0.85"/>
    <rect x="95" y="225" width="18" height="55" rx="3" fill="#0a1c34" opacity="0.15"/>
    <rect x="200" y="300" width="34" height="14" fill="#e0a02c"/>
    <circle cx="145" cy="230" r="6" fill="#e0a02c"/>
  </g>

  <!-- wheels -->
  <g fill="#0a1c34">
    <circle cx="150" cy="312" r="30"/>
    <circle cx="300" cy="312" r="30"/>
    <circle cx="470" cy="312" r="30"/>
  </g>
  <g fill="#7aa0c9">
    <circle cx="150" cy="312" r="13"/>
    <circle cx="300" cy="312" r="13"/>
    <circle cx="470" cy="312" r="13"/>
  </g>
</svg>
